version: 2

# Dữ liệu tham chiếu nhóm tự bổ sung (source_to_target_mapping.md mục 0.2). Nạp bằng: dbt seed (dbt build tự chạy).
seeds:
  - name: seed_brazil_states
    description: >
      27 đơn vị hành chính của Brazil (26 bang + Distrito Federal): mã bang -> tên bang, vùng.
      Phân cấp Vùng -> Bang -> Thành phố cho dim_geography, dim_customer, dim_seller.
    columns:
      - name: state_code
        description: Mã bang 2 chữ, khớp customers.customer_state, sellers.seller_state (VD SP).
        data_tests:
          - unique
          - not_null
      - name: state_name
        description: Tên bang có dấu (VD São Paulo).
        data_tests:
          - not_null
      - name: region
        description: 1 trong 5 vùng địa lý.
        data_tests:
          - accepted_values:
              values: ['Norte', 'Nordeste', 'Centro-Oeste', 'Sudeste', 'Sul']

  - name: seed_category_translation_extra
    description: >
      2 danh mục có sản phẩm nhưng thiếu bản dịch trong staging.category_translation (13 sản phẩm).
      dim_product lấy bản dịch từ category_translation, không có thì lấy ở đây.
    columns:
      - name: product_category_name
        description: Tên danh mục tiếng Bồ Đào Nha, khớp products.product_category_name (pc_gamer, portateis_cozinha_e_preparadores_de_alimentos).
        data_tests:
          - unique
          - not_null
      - name: product_category_name_english
        description: Tên danh mục tiếng Anh do nhóm tự dịch - dim_product.category_name_en lấy từ đây khi nguồn không có bản dịch.
