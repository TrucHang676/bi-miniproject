# Theme của app hỏi AI (ai/app.py) theo bảng màu dashboard Power BI (theme Olist_Lime_Soft).
# Streamlit đọc file này khi chạy từ gốc repo: streamlit run ai/app.py
[theme]
base = "light"
primaryColor = "#121316"
backgroundColor = "#EEF0F3"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#121316"
font = "sans serif"
